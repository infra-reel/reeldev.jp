apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ghcr-secret
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - cluster: admin
        url: https://172.16.245.1:6443
      - cluster: prod
        url: https://172.16.245.3:6443
      - cluster: dev
        url: https://172.16.245.5:6443
  template:
    metadata:
      name: 'ghcr-secret-{{cluster}}'
    spec:
      project: default
      source:
        repoURL: ''
        targetRevision: HEAD
        path: ''
        plugin:
          name: ''
      destination:
        server: '{{url}}'
        namespace: reeldev
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>ログイン — reeldev.jp 管理画面</title>
  <style>
    :root{--bg:#040E14;--panel:#0B1F29;--border:rgba(0,255,204,.15);--biolum:#00FFCC;--dim:#6A9BAB;--font:'Inter',system-ui,sans-serif}
    body{font-family:var(--font);background:var(--bg);color:#E8F4F8;min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .card{width:340px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:2.5rem;text-align:center;}
    h1{font-size:1rem;letter-spacing:.06em;color:var(--biolum);margin-bottom:.5rem;}
    p{font-size:.82rem;color:var(--dim);margin-bottom:2rem;line-height:1.8;}
    .discord-btn{
      display:flex;align-items:center;justify-content:center;gap:.75rem;
      padding:.75rem 1.5rem;border-radius:4px;
      background:#5865F2;color:#fff;font-size:.88rem;font-weight:500;
      text-decoration:none;transition:opacity .2s;letter-spacing:.02em;
    }
    .discord-btn:hover{opacity:.88}
    .discord-icon{width:22px;height:22px}
    .error{margin-top:1.2rem;font-size:.78rem;color:#FF5577;}
  </style>
</head>
<body>
<div class="card">
  <h1>reeldev.jp 管理画面</h1>
  <p>Discord アカウントでログインしてください。<br>管理者のみアクセスできます。</p>
  <a class="discord-btn" href="/login">
    <svg class="discord-icon" viewBox="0 0 71 55" fill="none">
      <path d="M60.1 4.9A58.5 58.5 0 0 0 45.4.4a.2.2 0 0 0-.2.1c-.6 1.1-1.3 2.5-1.8 3.6a54 54 0 0 0-16.3 0c-.5-1.1-1.2-2.5-1.8-3.6a.2.2 0 0 0-.2-.1A58.3 58.3 0 0 0 10.9 4.9a.2.2 0 0 0-.1.1C1.6 18.1-.9 31 .3 43.7a.2.2 0 0 0 .1.2 58.8 58.8 0 0 0 17.7 9 .2.2 0 0 0 .2-.1c1.4-1.9 2.6-3.9 3.6-6a.2.2 0 0 0-.1-.3 38.7 38.7 0 0 1-5.5-2.6.2.2 0 0 1 0-.4c.4-.3.7-.5 1.1-.8a.2.2 0 0 1 .2 0c11.5 5.3 24 5.3 35.4 0a.2.2 0 0 1 .2 0c.4.3.8.6 1.1.8a.2.2 0 0 1 0 .4 36.1 36.1 0 0 1-5.5 2.6.2.2 0 0 0-.1.3c1.1 2.1 2.3 4.1 3.6 6a.2.2 0 0 0 .2.1 58.6 58.6 0 0 0 17.7-9 .2.2 0 0 0 .1-.2c1.5-15-2.5-28-10.5-39.6a.2.2 0 0 0-.1-.1ZM23.7 36c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2c3.6 0 6.5 3.3 6.4 7.2 0 4-2.9 7.2-6.4 7.2Zm23.6 0c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2c3.6 0 6.5 3.3 6.4 7.2 0 4-2.8 7.2-6.4 7.2Z" fill="#fff"/>
    </svg>
    Discord でログイン
  </a>
  <script>
    const p = new URLSearchParams(location.search).get('error');
    if (p === 'forbidden') document.write('<p class="error">このアカウントはアクセス権がありません。</p>');
    if (p === 'oauth_error') document.write('<p class="error">認証エラーが発生しました。再度お試しください。</p>');
  </script>
</div>
</body>
</html>

---
# ── PersistentVolume & Claim (NFS Static Binding) ───────────────────────────
apiVersion: v1
kind: PersistentVolume
metadata:
  name: reeldev-data-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 172.16.254.255          # ← NFSサーバーの実際のIPアドレスに変更してください
    path: /exports/k8s/shared/reeldev   # 用途に合わせて /exports/k8s や /exports/k8s/shared
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reeldev-data
  namespace: reeldev
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""          # 静的バインドのため空を指定
  resources:
    requests:
      storage: 10Gi
  volumeName: reeldev-data-pv

---
# ── Backend API (Deployment with Vault & NFS) ──────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: reeldev
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "reeldev"
        vault.hashicorp.com/agent-inject-secret-config.env: "secret/data/reeldev/config"
        vault.hashicorp.com/agent-inject-template-config.env: |
          {{- with secret "secret/data/reeldev/config" -}}
          {{ range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
          {{ end }}
          {{- end -}}
    spec:
      enableServiceLinks: false
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      containers:
        - name: api
          image: ghcr.io/infra-reel/reeldev-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: {cpu: "50m", memory: "128Mi"}
            limits:   {cpu: "500m", memory: "256Mi"}
          readinessProbe:
            httpGet: {path: /healthz, port: 3001}
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: reeldev-data
      imagePullSecrets:
        - name: ghcr-secret

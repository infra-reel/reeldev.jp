server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location ~* \.(css|js|png|jpg|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # /news/123 → 詳細ページ
    location ~ ^/news/\d+$ {
        try_files /news-detail.html =404;
    }

    # /news → 一覧ページ
    location = /news {
        try_files /news.html =404;
    }

    location = /about  { try_files /about.html  =404; }
    location = /tech   { try_files /tech.html   =404; }
    location = /sns    { try_files /sns.html    =404; }
    location = /thanks { try_files /thanks.html =404; }

    location / {
        try_files $uri $uri.html /index.html;
    }

    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads/ {
        proxy_pass http://api:3001/uploads/;
    }

    gzip on;
    gzip_types text/css application/javascript text/html application/json;
}

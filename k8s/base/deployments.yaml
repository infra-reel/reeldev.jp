---
# ── Frontend (Nginx) ────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: reeldev
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "reeldev"
        vault.hashicorp.com/agent-inject-secret-config.env: "secret/data/reeldev/config"
        vault.hashicorp.com/agent-inject-template-config.env: |
          {{- with secret "secret/data/reeldev/config" -}}
          {{ range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
          {{ end }}
          {{- end -}}
    spec:
      enableServiceLinks: false
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      containers:
        - name: frontend
          image: ghcr.io/infra-reel/reeldev-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3030
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits:   {cpu: "200m", memory: "128Mi"}
      imagePullSecrets:
        - name: ghcr-secret

---
# ── Backend API ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: reeldev
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "reeldev"
        vault.hashicorp.com/agent-inject-secret-config.env: "secret/data/reeldev/config"
        vault.hashicorp.com/agent-inject-template-config.env: |
          {{- with secret "secret/data/reeldev/config" -}}
          {{ range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
          {{ end }}
          {{- end -}}
    spec:
      enableServiceLinks: false
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      containers:
        - name: api
          image: ghcr.io/infra-reel/reeldev-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          # envFrom (secretRef) は削除し、Vault経由で注入するか必要に応じて環境変数を指定
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: {cpu: "50m", memory: "128Mi"}
            limits:   {cpu: "500m", memory: "256Mi"}
          readinessProbe:
            httpGet: {path: /healthz, port: 3001}
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: reeldev-data
      imagePullSecrets:
        - name: ghcr-secret

---
# ── Admin Panel ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: reeldev
  labels:
    app: admin
spec:
  replicas: 1
  selector:
    matchLabels: {app: admin}
  template:
    metadata:
      labels: {app: admin}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "reeldev"
        vault.hashicorp.com/agent-inject-secret-config.env: "secret/data/reeldev/config"
        vault.hashicorp.com/agent-inject-template-config.env: |
          {{- with secret "secret/data/reeldev/config" -}}
          {{ range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
          {{ end }}
          {{- end -}}
    spec:
      enableServiceLinks: false
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      containers:
        - name: admin
          image: ghcr.io/infra-reel/reeldev-admin:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3002
          # envFrom (secretRef) は削除
          resources:
            requests: {cpu: "30m", memory: "64Mi"}
            limits:   {cpu: "200m", memory: "128Mi"}
      imagePullSecrets:
        - name: ghcr-secret

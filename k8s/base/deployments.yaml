---
# ── Frontend (Nginx) ────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: reeldev-dev
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      enableServiceLinks: false
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
        tier: prod
      containers:
        - name: frontend
          image: ghcr.io/infra-reel/reeldev-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 6060
          envFrom:
            - secretRef:
                name: reeldev-secret
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits:   {cpu: "200m", memory: "128Mi"}
      imagePullSecrets:
        - name: reeldev-ghcr

---
# ── Backend API ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: reeldev-dev
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      enableServiceLinks: false
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
        tier: prod
      containers:
        - name: api
          image: ghcr.io/infra-reel/reeldev-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 6002
          envFrom:
            - secretRef:
                name: reeldev-secret
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: {cpu: "50m", memory: "128Mi"}
            limits:   {cpu: "500m", memory: "256Mi"}
          readinessProbe:
            httpGet: {path: /healthz, port: 6002}
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: reeldev-data-dev
      imagePullSecrets:
        - name: reeldev-ghcr

---
# ── Admin Panel ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: reeldev-dev
  labels:
    app: admin
spec:
  replicas: 1
  selector:
    matchLabels: {app: admin}
  template:
    metadata:
      labels: {app: admin}
    spec:
      enableServiceLinks: false
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
        tier: prod
      containers:
        - name: admin
          image: ghcr.io/infra-reel/reeldev-admin:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 6004
          envFrom:
            - secretRef:
                name: reeldev-secret
          env:
            - name: NODE_ENV
              value: "production"
            - name: SESSION_DIR
              value: "/data/sessions"
            - name: DISCORD_REDIRECT_URI
              value: "https://admindev.reeldev.jp/auth/callback"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: {cpu: "30m", memory: "64Mi"}
            limits:   {cpu: "200m", memory: "128Mi"}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: reeldev-data-dev
      imagePullSecrets:
        - name: reeldev-ghcr

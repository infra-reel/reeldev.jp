apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: reeldev
spec:
  selector:
    app: frontend # ※実際のポッドのラベルに合わせて調整してください
  ports:
    - port: 80
      targetPort: 3000 # アプリのコンテナポートに合わせて変更してください
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: reeldev
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: reeldev
spec:
  selector:
    app: admin
  ports:
    - port: 80
      targetPort: 3000

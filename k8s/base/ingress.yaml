apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reeldev-main
  namespace: reeldev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: reeldev.jp
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 3001
      - path: /uploads
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 3001
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
  tls:
  - hosts:
    - reeldev.jp
    secretName: reeldev-main-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reeldev-admin
  namespace: reeldev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: admin.reeldev.jp
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: admin
            port:
              number: 3002
  tls:
  - hosts:
    - admin.reeldev.jp
    secretName: reeldev-admin-tls

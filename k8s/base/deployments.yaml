# ── Admin Panel ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: reeldev
  labels:
    app: admin
spec:
  replicas: 1
  selector:
    matchLabels: {app: admin}
  template:
    metadata:
      labels: {app: admin}
    spec:
      enableServiceLinks: false
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
        tier: prod
      containers:
        - name: admin
          image: ghcr.io/infra-reel/reeldev-admin:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3002
          envFrom:
            - secretRef:
                name: reeldev-secret
          env:
            - name: NODE_ENV
              value: "production"
            - name: SESSION_DIR
              value: "/data/sessions"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: {cpu: "30m", memory: "64Mi"}
            limits:   {cpu: "200m", memory: "128Mi"}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: reeldev-data
      imagePullSecrets:
        - name: reeldev-ghcr

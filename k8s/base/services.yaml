apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: reeldev-dev
spec:
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
    - IPv6
    - IPv4
  selector:
    app: api
  ports:
    - port: 6002
      targetPort: 6002
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: reeldev-dev
spec:
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
    - IPv6
    - IPv4
  selector:
    app: frontend
  ports:
    - port: 6060
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: reeldev-dev
spec:
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
    - IPv6
    - IPv4
  selector:
    app: admin
  ports:
    - port: 6004
      targetPort: 6004

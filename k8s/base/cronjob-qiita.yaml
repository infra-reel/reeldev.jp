# ── Qiita 記事を1日1回自動取得 ───────────────────────────────────────────────
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qiita-refresh
  namespace: reeldev
spec:
  schedule: "0 4 * * *"   # 毎日 04:00 UTC (= 13:00 JST)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            node-role.kubernetes.io/worker: "true"
            tier: prod
          containers:
            - name: curl
              image: curlimages/curl:8.7.1
              command:
                - sh
                - -c
                - |
                  curl -sf -X POST \
                    -H "x-api-key: ${ADMIN_API_KEY}" \
                    http://api.reeldev.svc.cluster.local:3001/api/qiita/refresh
              envFrom:
                - secretRef:
                    name: reeldev-secret   # ← 末尾の "s" を取って Deployment と合わせました

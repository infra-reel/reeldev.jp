apiVersion: v1
kind: PersistentVolume
metadata:
  name: reeldev-data-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: nfs-server       # 正しいNFSサーバーのIPを指定
    path: /exports/k8s/shared/reeldev   # 正しいエクスポートパスを指定
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reeldev-data
  namespace: reeldev
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 10Gi
  volumeName: reeldev-data-pv

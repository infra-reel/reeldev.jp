apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: reeldev
spec:
  selector:
    app: api
  ports:
    - port: 3001
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: reeldev
spec:
  selector:
    app: frontend
  ports:
    - port: 3030
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: reeldev
spec:
  selector:
    app: admin
  ports:
    - port: 3002
      targetPort: 3000

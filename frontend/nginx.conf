server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Static assets
    location ~* \.(css|js|png|jpg|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # /news/:id → news_detail.html があれば、なければ index (SPA風)
    location /news {
        try_files $uri $uri.html /news.html =404;
    }
    location /about  { try_files $uri $uri.html /about.html  =404; }
    location /tech   { try_files $uri $uri.html /tech.html   =404; }
    location /sns    { try_files $uri $uri.html /sns.html    =404; }
    location /thanks { try_files $uri $uri.html /thanks.html =404; }

    location / {
        try_files $uri $uri.html /index.html;
    }

    # Proxy to API (サービス名はKubernetes内の "api" に統一)
    # Proxy to API (変数を経由させて起動時の即死を防ぐ)
    location /api/ {
        set $backend_api api;
        proxy_pass http://$backend_api:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads/ {
        set $backend_api api;
        proxy_pass http://$backend_api:3001/uploads/;
    }

    gzip on;
    # text/html は gzip のデフォルトに含まれるため重複エラーを避けるために除外または整理
    gzip_types text/css application/javascript application/json image/svg+xml;
}
